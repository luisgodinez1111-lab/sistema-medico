services:
  postgres:
    image: postgres:17
    environment: {POSTGRES_DB: medical_os, POSTGRES_USER: medical_os_migrator, POSTGRES_PASSWORD: dev_only_change_me}
    ports: ['5432:5432']
    healthcheck: {test: ['CMD-SHELL','pg_isready -U medical_os_migrator -d medical_os'], interval: 3s, timeout: 3s, retries: 20}
    volumes: [medical_os_pg:/var/lib/postgresql/data]
  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes: ['..:/workspace']
    command: ['sh','-lc','corepack enable && pnpm install --frozen-lockfile && pnpm build:web']
    depends_on: {postgres: {condition: service_healthy}}
  worker:
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes: ['..:/workspace']
    command: ['sh','-lc','corepack enable && pnpm install --frozen-lockfile && node apps/worker/src/index.ts']
    depends_on: {postgres: {condition: service_healthy}}
volumes: {medical_os_pg: {}}
