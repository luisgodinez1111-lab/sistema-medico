name: runtime-verification-v20
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:all
      - run: node release/v20/repository-audit.mjs
      - run: node release/v20/rls-model-lab.mjs
      - run: node release/v20/crash-recovery-lab.mjs
      - run: node release/v20/sequence-oracle-lab.mjs
