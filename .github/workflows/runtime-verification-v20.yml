name: runtime-verification-v20
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medical_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d medical_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: node release/v20/repository-audit.mjs
      - run: node release/v20/rls-model-lab.mjs
      - run: node release/v20/crash-recovery-lab.mjs
      - run: node release/v20/sequence-oracle-lab.mjs
