name: DAST (ZAP baseline)

# DAST (§15): escaneo dinámico pasivo con OWASP ZAP contra el sitio en producción.
# NO corre en cada push (es lento y golpea un entorno real): sólo programado y manual.
# Alcance HONESTO: la app está tras login, así que el baseline cubre la superficie NO
# autenticada (/login, cabeceras, TLS, cookies). El escaneo autenticado y activo queda
# para el pentest previo a go-live (superficie con sesión).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: ZAP baseline (superficie no autenticada)
        run: |
          docker run --rm -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://sistema-medico-web.vercel.app -I -m 5 \
            -r zap-report.html || true
      - name: Publicar reporte ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-report.html
          if-no-files-found: ignore
