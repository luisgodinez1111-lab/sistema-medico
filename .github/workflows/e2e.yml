name: E2E (Playwright)

# E2E del slice clínico (§NIVEL 16). Manual: necesita una BD con el seed demo y
# AUTH_SECRET (secrets del repo). No corre en cada push (toca una BD real y arranca
# la app). Las specs son de SÓLO LECTURA (login + navegación), no mutan datos.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Verificar secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$AUTH_SECRET" ]; then
            echo "::error::Faltan los secrets DATABASE_URL y/o AUTH_SECRET del repo." >&2
            exit 1
          fi
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build de paquetes
        run: pnpm --filter @medical-os/db build
      - name: Seed demo (idempotente)
        run: pnpm --filter @medical-os/db exec tsx src/seed.ts
      - name: Instalar Chromium
        run: pnpm --filter @medical-os/web exec playwright install --with-deps chromium
      - name: Playwright E2E
        run: pnpm --filter @medical-os/web test:e2e
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
