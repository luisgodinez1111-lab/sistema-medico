# Gate de regresión en vivo (ENG-056: integration/clinical-regression gate requerido; EXEC operating model
# paso 7). Cierra la brecha de la auditoría 2026-09-17: las pruebas en vivo .mts —la evidencia más fuerte—
# no corrían en CI. Levanta un Postgres DESECHABLE, aplica migraciones+roles, y corre el smoke curado.
name: live-regression
on: [push, pull_request]
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: medical_os_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medical_os_test?sslmode=disable
      CI_DB_BOOTSTRAP_ALLOW: '1'
      SESSION_SIGNING_SECRET: ci-live-regression-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap disposable DB (roles + migrations)
        run: pnpm exec tsx scripts/ci/bootstrap-db.mts
      - name: Live regression smoke (kernel + safety loops + CDS)
        run: pnpm exec tsx scripts/ci/live-smoke.mts
