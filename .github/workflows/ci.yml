name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio por defecto (§15, §25)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Secret scanning — bloquea secretos en el diff (§16 gate)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Calidad: lint + format + typecheck + unit + build
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # 3. Dependencias y licencias
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit (falla en vulnerabilidades altas/críticas)
        run: pnpm audit --audit-level=high || true # TODO: endurecer a fallo estricto antes de producción (§15)

  # 4. CodeQL — SAST (§15)
  codeql:
    runs-on: ubuntu-latest
    permissions:
      # `permissions` a nivel de job REEMPLAZA el default del workflow: hay que
      # re-declarar `contents: read` o el checkout falla ("repository not found").
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      # No bloquea el pipeline: en repos privados sin GitHub Advanced Security la
      # subida a Code Scanning devuelve 403. Con GHAS habilitado, publica normal.
      - uses: github/codeql-action/analyze@v4
        continue-on-error: true

  # 5. Semgrep — SAST con reglas de seguridad OWASP (§15). Complementa a CodeQL
  #    con packs enfocados (security-audit, OWASP Top Ten, TS/React, secrets).
  #    Los hallazgos van a Code Scanning; no bloquean el pipeline (aún en triage).
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read # necesario para el checkout (el bloque de job reemplaza el default)
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Semgrep
        run: pip install semgrep
      - name: Semgrep scan (SARIF)
        continue-on-error: true
        run: >
          semgrep scan
          --config p/security-audit
          --config p/owasp-top-ten
          --config p/javascript
          --config p/typescript
          --config p/react
          --config p/secrets
          --sarif --output semgrep.sarif
      - name: Subir SARIF a Code Scanning
        if: always()
        continue-on-error: true # 403 sin GHAS en repos privados; no bloquea el CI
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  # 6. Dependency review — bloquea deps vulnerables/licencias problemáticas en el
  #    diff del PR (§15). Sólo aplica en pull_request (necesita base vs head).
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
