name: "✨ Feature"
description: "Nueva capacidad de producto"
labels: ["type:feature"]
body:
  - type: textarea
    id: user-problem
    attributes:
      label: Usuario, problema y resultado esperado (DoD §31)
      description: ¿Quién lo necesita, qué problema resuelve y qué resultado se espera?
      placeholder: "Como <rol> necesito <capacidad> para <resultado>."
    validations:
      required: true
  - type: dropdown
    id: phi
    attributes:
      label: ¿Maneja PHI o permisos?
      options: ["No", "Sí — requiere threat + privacy impact"]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done aplicable
      options:
        - label: Autorización server-side
        - label: Audit/provenance si corresponde
        - label: Estados loading/empty/error/permission/offline
        - label: Responsive desktop/iPad/móvil
        - label: Tests (unit/integration/e2e según flujo)
        - label: Sin log de PHI/secret
        - label: Accesibilidad
