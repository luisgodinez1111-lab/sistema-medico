name: "🚑 Clinical Safety"
description: "Riesgo para la seguridad del paciente (red flags, resultados sin revisar, dosis, etc.)"
labels: ["type:clinical-safety", "priority:high"]
body:
  - type: markdown
    attributes:
      value: "Estos issues se revisan como **Clinical Safety Case** (§5). Pueden bloquear releases."
  - type: textarea
    id: hazard
    attributes:
      label: Peligro clínico identificado
      description: ¿Qué puede salir mal para el paciente?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severidad potencial
      options: ["Catastrófica", "Mayor", "Moderada", "Menor"]
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Mitigación propuesta
    validations:
      required: true
  - type: textarea
    id: safer
    attributes:
      label: Categoría SAFER relacionada (§27)
      placeholder: "Resultados/seguimiento, comunicación clínica, CPOE, gestión del sistema..."
